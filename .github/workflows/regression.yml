name: CBAMValid Regression Guard

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  regression-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Probe sandbox deploy credential availability
        if: startsWith(github.head_ref, 'ops/probe-sandbox-deploy-credentials-')
        env:
          FIREBASE_TOKEN_PRESENT: ${{ secrets.FIREBASE_TOKEN != '' }}
          FIREBASE_SANDBOX_SA_PRESENT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CBAM_DESK_SANDBOX != '' }}
          FIREBASE_PROD_SA_PRESENT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CBAM_DESK != '' }}
          GCP_SA_KEY_PRESENT: ${{ secrets.GCP_SA_KEY != '' }}
          GOOGLE_CREDENTIALS_PRESENT: ${{ secrets.GOOGLE_CREDENTIALS != '' }}
          WIF_PROVIDER_SECRET_PRESENT: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER != '' }}
          WIF_SERVICE_ACCOUNT_SECRET_PRESENT: ${{ secrets.GCP_SERVICE_ACCOUNT != '' }}
          WIF_PROVIDER_VAR_PRESENT: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER != '' }}
          WIF_SERVICE_ACCOUNT_VAR_PRESENT: ${{ vars.GCP_SERVICE_ACCOUNT != '' }}
          FIREBASE_PROJECT_VAR_PRESENT: ${{ vars.FIREBASE_PROJECT != '' }}
        run: |
          echo "FIREBASE_TOKEN_PRESENT=${FIREBASE_TOKEN_PRESENT}"
          echo "FIREBASE_SANDBOX_SA_PRESENT=${FIREBASE_SANDBOX_SA_PRESENT}"
          echo "FIREBASE_PROD_SA_PRESENT=${FIREBASE_PROD_SA_PRESENT}"
          echo "GCP_SA_KEY_PRESENT=${GCP_SA_KEY_PRESENT}"
          echo "GOOGLE_CREDENTIALS_PRESENT=${GOOGLE_CREDENTIALS_PRESENT}"
          echo "WIF_PROVIDER_SECRET_PRESENT=${WIF_PROVIDER_SECRET_PRESENT}"
          echo "WIF_SERVICE_ACCOUNT_SECRET_PRESENT=${WIF_SERVICE_ACCOUNT_SECRET_PRESENT}"
          echo "WIF_PROVIDER_VAR_PRESENT=${WIF_PROVIDER_VAR_PRESENT}"
          echo "WIF_SERVICE_ACCOUNT_VAR_PRESENT=${WIF_SERVICE_ACCOUNT_VAR_PRESENT}"
          echo "FIREBASE_PROJECT_VAR_PRESENT=${FIREBASE_PROJECT_VAR_PRESENT}"

      - name: Setup Node.js (22)
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Type Check (strict)
        run: npm run typecheck

      - name: Vitest Unit Tests
        run: npx vitest run

      - name: Render current four-sector dossier artifacts
        if: startsWith(github.head_ref, 'refresh/four-sector-dossiers-')
        run: |
          npm run render:four-complete-dossiers
          npm run inspect:four-complete-dossiers
          npm run verify:four-complete-dossiers
          tar -czf artifacts/four-sector-dossiers-current.tar.gz -C artifacts four-complete-dossiers

      - name: Upload current four-sector dossier artifacts
        if: startsWith(github.head_ref, 'refresh/four-sector-dossiers-')
        uses: actions/upload-artifact@v4
        with:
          name: four-sector-dossiers-current
          path: |
            artifacts/four-complete-dossiers/
            artifacts/four-sector-dossiers-current.tar.gz
          retention-days: 14
          if-no-files-found: error

      - name: Build (Next.js — Firebase Web Frameworks)
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NEXT_PUBLIC_FIREBASE_API_KEY: "ci-placeholder-not-a-secret"
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: "cbamvalid-ci.invalid"
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: "cbamvalid-ci"
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: "cbamvalid-ci.appspot.com"
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "000000000000"
          NEXT_PUBLIC_FIREBASE_APP_ID: "1:000000000000:web:0000000000000000000000"
          ADMIN_USE_ADC: "true"
          GCLOUD_PROJECT: "cbamvalid-ci"

      - name: Install Playwright
        run: npx playwright install --with-deps chromium webkit

      - name: Run Critical-Flow E2E Tests
        run: npm run test:e2e:critical
        env:
          BASE_URL: https://cbamvalid.com
          PLAYWRIGHT_TEST_BASE_URL: https://cbamvalid.com

      - name: Upload Playwright Report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
