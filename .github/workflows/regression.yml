name: CBAMValid Regression Guard

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  regression-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js (24)
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - name: Verify Node 24 runtime
        run: node --version | grep -E '^v24\.'

      - name: Install dependencies
        run: npm ci

      - name: Type Check (strict)
        run: npm run typecheck

      - name: Vitest Unit Tests
        run: npx vitest run

      - name: CBAMValid 6.0 mandatory gates (G-09 test-data leak, G-14 boundary protection)
        run: npm run gate:release-6

      - name: Render current four-sector dossier artifacts
        if: startsWith(github.head_ref, 'refresh/four-sector-dossiers-')
        run: |
          npm run render:four-complete-dossiers
          npm run inspect:four-complete-dossiers
          npm run verify:four-complete-dossiers
          tar -czf artifacts/four-sector-dossiers-current.tar.gz -C artifacts four-complete-dossiers

      - name: Upload current four-sector dossier artifacts
        if: startsWith(github.head_ref, 'refresh/four-sector-dossiers-')
        uses: actions/upload-artifact@v7
        with:
          name: four-sector-dossiers-current
          path: |
            artifacts/four-complete-dossiers/
            artifacts/four-sector-dossiers-current.tar.gz
          retention-days: 14
          if-no-files-found: error

      - name: Build (Next.js — Firebase Web Frameworks)
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NEXT_PUBLIC_FIREBASE_API_KEY: "ci-placeholder-not-a-secret"
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: "cbamvalid-ci.invalid"
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: "cbamvalid-ci"
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: "cbamvalid-ci.appspot.com"
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "000000000000"
          NEXT_PUBLIC_FIREBASE_APP_ID: "1:000000000000:web:0000000000000000000000"
          ADMIN_USE_ADC: "true"
          GCLOUD_PROJECT: "cbamvalid-ci"

      - name: Install Playwright
        run: npx playwright install --with-deps chromium webkit

      # Source regression must exercise the checked-out PR/main code, not whatever
      # revision happens to be live on cbamvalid.com. Production smoke belongs in
      # the gated deployment workflow after the exact source SHA is deployed.
      - name: Run Critical-Flow E2E Tests (checked-out source)
        run: npm run test:e2e:critical
        env:
          PLAYWRIGHT_TEST_BASE_URL: http://localhost:3000
          NEXT_TELEMETRY_DISABLED: "1"
          NEXT_PUBLIC_FIREBASE_API_KEY: "ci-placeholder-not-a-secret"
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: "cbamvalid-ci.invalid"
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: "cbamvalid-ci"
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: "cbamvalid-ci.appspot.com"
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "000000000000"
          NEXT_PUBLIC_FIREBASE_APP_ID: "1:000000000000:web:0000000000000000000000"
          ADMIN_USE_ADC: "true"
          GCLOUD_PROJECT: "cbamvalid-ci"

      - name: Upload Playwright Report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
