name: SEO V6 Conformance

on:
  pull_request:
    branches: [main]
    paths:
      - "docs/seo/**"
      - "data/seo/**"
      - "sites/**/seo.config.json"
      - "seo.config.defaults.json"
      - "seo.config.schema.json"
      - "PHASE_CONTRACTS.json"
      - "scripts/seo/**"
      - "tests/conformance/**"
      - "package.json"
      - ".github/workflows/seo-conformance.yml"
  workflow_dispatch:
    inputs:
      phase:
        description: "V6 phase contract to validate"
        required: true
        default: "bootstrap"
        type: choice
        options:
          - bootstrap
          - faz-00
          - faz-01
          - faz-02
          - faz-03
          - faz-04
          - faz-05
          - faz-06
          - faz-07
          - faz-08
          - faz-09
          - faz-10
          - faz-11
          - faz-12
          - faz-13
          - faz-14
          - faz-15
          - faz-16
          - faz-17
          - faz-18
          - faz-19

permissions:
  contents: read

concurrency:
  group: seo-v6-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  v6-conformance:
    name: V6 phase-aware preflight, build, guards, conformance
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_FIREBASE_API_KEY: "ci-placeholder-not-a-secret"
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: "cbamvalid-ci.invalid"
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: "cbamvalid-ci"
      NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: "cbamvalid-ci.appspot.com"
      NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "000000000000"
      NEXT_PUBLIC_FIREBASE_APP_ID: "1:000000000000:web:0000000000000000000000"
      ADMIN_USE_ADC: "true"
      GCLOUD_PROJECT: "cbamvalid-ci"
    steps:
      - name: Checkout full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Verify Node 24 runtime
        run: node --version | grep -E '^v24\.'

      - name: Resolve V6 phase contract
        id: seo_phase
        shell: bash
        env:
          DISPATCH_PHASE: ${{ inputs.phase }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            phase="${DISPATCH_PHASE}"
          else
            ref="${GITHUB_HEAD_REF:-}"
            if [[ "$ref" == seo/bootstrap-* ]]; then
              phase="bootstrap"
            elif [[ "$ref" =~ ^seo/faz-([0-9]{2})- ]]; then
              phase="faz-${BASH_REMATCH[1]}"
            else
              echo "Unable to resolve V6 phase from PR branch: $ref" >&2
              exit 4
            fi
          fi

          case "$phase" in
            bootstrap|faz-00|faz-01|faz-02|faz-03|faz-04|faz-05|faz-06|faz-07|faz-08|faz-09|faz-10|faz-11|faz-12|faz-13|faz-14|faz-15|faz-16|faz-17|faz-18|faz-19) ;;
            *) echo "Invalid V6 phase: $phase" >&2; exit 4 ;;
          esac

          echo "phase=$phase" >> "$GITHUB_OUTPUT"
          echo "SEO_PHASE_RESOLVED=$phase"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: V6 preflight
        run: npm run seo:preflight -- --site cbamvalid --phase "${{ steps.seo_phase.outputs.phase }}" --dry-run

      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Existing release guards
        run: |
          npm run guard:hosting-architecture
          npm run guard:software-only-positioning
          npm run guard:github-actions
          npm run seo:validate

      - name: V6 conformance and negative fixtures
        run: npm run seo:conformance

      - name: Phase 04 browser-render gate
        if: steps.seo_phase.outputs.phase == 'faz-04'
        shell: bash
        run: |
          set -euo pipefail
          npx playwright install --with-deps chromium
          SEO_SKIP_BUILD=1 SEO_RENDER_BROWSER=1 bash scripts/seo/run-rendered-gate.sh

      - name: Prove cold-start fails closed without GSC history
        shell: bash
        run: |
          set +e
          npm run seo:coldstart-check -- --site cbamvalid --dry-run
          code=$?
          set -e
          if [ "$code" -ne 3 ]; then
            echo "Expected missing-data exit 3, got $code"
            exit 1
          fi
          echo "COLDSTART_MISSING_DATA_EXIT=3 PASS"
