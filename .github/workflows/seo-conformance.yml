name: SEO V6 Conformance

on:
  pull_request:
    branches: [main]
    paths:
      - "docs/seo/**"
      - "data/seo/**"
      - "sites/**/seo.config.json"
      - "seo.config.defaults.json"
      - "seo.config.schema.json"
      - "PHASE_CONTRACTS.json"
      - "scripts/seo/**"
      - "tests/conformance/**"
      - "app/**"
      - "components/**"
      - "lib/seo/**"
      - "public/**"
      - "firebase.json"
      - "next.config.js"
      - "package.json"
      - ".github/workflows/seo-conformance.yml"
  workflow_dispatch:
    inputs:
      phase:
        description: "V6 phase contract to validate"
        required: true
        default: "bootstrap"
        type: choice
        options:
          - bootstrap
          - faz-00
          - faz-01
          - faz-02
          - faz-03
          - faz-04
          - faz-05
          - faz-06
          - faz-07
          - faz-08
          - faz-09
          - faz-10
          - faz-11
          - faz-12
          - faz-13
          - faz-14
          - faz-15
          - faz-16
          - faz-17
          - faz-18
          - faz-19

permissions:
  contents: read

concurrency:
  group: seo-v6-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  v6-conformance:
    name: V6 phase-aware preflight, build, guards, conformance
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_FIREBASE_API_KEY: "ci-placeholder-not-a-secret"
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: "cbamvalid-ci.invalid"
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: "cbamvalid-ci"
      NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: "cbamvalid-ci.appspot.com"
      NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "000000000000"
      NEXT_PUBLIC_FIREBASE_APP_ID: "1:000000000000:web:0000000000000000000000"
      ADMIN_USE_ADC: "true"
      GCLOUD_PROJECT: "cbamvalid-ci"
    steps:
      - name: Checkout full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Verify Node 24 runtime
        run: node --version | grep -E '^v24\.'

      - name: Resolve V6 phase contract
        id: seo_phase
        shell: bash
        env:
          DISPATCH_PHASE: ${{ inputs.phase }}
        run: |
          set -euo pipefail
          phase=""
          phase_scoped="false"

          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            phase="${DISPATCH_PHASE}"
            phase_scoped="true"
          else
            ref="${GITHUB_HEAD_REF:-}"
            if [[ "$ref" == seo/bootstrap-* ]]; then
              phase="bootstrap"
              phase_scoped="true"
            elif [[ "$ref" =~ ^seo/faz-([0-9]{2})- ]]; then
              phase="faz-${BASH_REMATCH[1]}"
              phase_scoped="true"
            else
              echo "SEO_PHASE_SCOPED=false branch=$ref"
              echo "Non-SEO PR: skip phase write-lock/runtime mapping, keep global build/guards/conformance active."
            fi
          fi

          if [ "$phase_scoped" = "true" ]; then
            case "$phase" in
              bootstrap|faz-00|faz-01|faz-02|faz-03|faz-04|faz-05|faz-06|faz-07|faz-08|faz-09|faz-10|faz-11|faz-12|faz-13|faz-14|faz-15|faz-16|faz-17|faz-18|faz-19) ;;
              *) echo "Invalid V6 phase: $phase" >&2; exit 4 ;;
            esac
            echo "SEO_PHASE_RESOLVED=$phase"
          fi

          echo "phase=$phase" >> "$GITHUB_OUTPUT"
          echo "phase_scoped=$phase_scoped" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: V6 phase preflight
        if: steps.seo_phase.outputs.phase_scoped == 'true'
        run: npm run seo:preflight -- --site cbamvalid --phase "${{ steps.seo_phase.outputs.phase }}" --dry-run

      - name: Non-SEO PR phase boundary
        if: steps.seo_phase.outputs.phase_scoped != 'true'
        run: echo "SEO_PHASE_PREFLIGHT=SKIP_NON_SEO_PR"

      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Phase-specific runtime gate
        if: steps.seo_phase.outputs.phase_scoped == 'true'
        shell: bash
        env:
          SEO_PHASE: ${{ steps.seo_phase.outputs.phase }}
          SEO_SKIP_BUILD: "1"
        run: |
          set -euo pipefail
          case "$SEO_PHASE" in
            faz-04)
              echo "SEO_PHASE_RUNTIME_GATE=scripts/seo/run-rendered-gate.sh"
              bash scripts/seo/run-rendered-gate.sh
              ;;
            faz-07)
              echo "SEO_PHASE_RUNTIME_GATE=scripts/seo/link-equity.ts + scripts/seo/cwv-field-gate.ts"
              set +e
              npx tsx scripts/seo/link-equity.ts --site cbamvalid --dry-run
              link_code=$?
              npx tsx scripts/seo/cwv-field-gate.ts --site cbamvalid --dry-run
              cwv_code=$?
              set -e
              for code in "$link_code" "$cwv_code"; do
                case "$code" in
                  0) ;;
                  2) echo "SEO_PHASE_RUNTIME_WARN=$code" ;;
                  *) echo "SEO_PHASE_RUNTIME_GATE=FAIL code=$code" >&2; exit "$code" ;;
                esac
              done
              ;;
            *)
              echo "SEO_PHASE_RUNTIME_GATE=NONE"
              ;;
          esac

      - name: Non-SEO PR runtime boundary
        if: steps.seo_phase.outputs.phase_scoped != 'true'
        run: echo "SEO_PHASE_RUNTIME_GATE=SKIP_NON_SEO_PR"

      - name: Existing release guards
        run: |
          npm run guard:hosting-architecture
          npm run guard:software-only-positioning
          npm run guard:github-actions
          npm run seo:validate

      - name: V6 conformance and negative fixtures
        run: npm run seo:conformance

      - name: Prove cold-start fails closed without GSC history
        shell: bash
        run: |
          set +e
          npm run seo:coldstart-check -- --site cbamvalid --dry-run
          code=$?
          set -e
          if [ "$code" -ne 3 ]; then
            echo "Expected missing-data exit 3, got $code"
            exit 1
          fi
          echo "COLDSTART_MISSING_DATA_EXIT=3 PASS"
