name: 499 USD Release Contract

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  artifact-bound-release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      EXACT_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

    steps:
      - name: Checkout exact candidate commit
        uses: actions/checkout@v7
        with:
          ref: ${{ env.EXACT_CANDIDATE_SHA }}
          persist-credentials: false

      - name: Prove exact checkout provenance
        run: |
          ACTUAL_SHA="$(git rev-parse HEAD)"
          echo "EXPECTED_SHA=${EXACT_CANDIDATE_SHA}"
          echo "ACTUAL_SHA=${ACTUAL_SHA}"
          test "${ACTUAL_SHA}" = "${EXACT_CANDIDATE_SHA}"

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Verify Node 24 runtime
        run: node --version | grep -E '^v24\.'

      - name: Install locked dependencies
        run: npm ci

      - name: Typecheck exact candidate
        run: npm run typecheck

      - name: Run frozen report and package contracts
        run: >-
          npx vitest run
          tests/reports/release-499-contract.test.ts
          tests/reports/verifier-status-single-truth.test.ts
          tests/reports/premium-dossier-truth-contract.test.ts
          tests/reports/cross-format-consistency.test.ts
          tests/reports/four-complete-dossiers.test.ts
          tests/reports/render-qa.test.ts
          tests/reports/editorial-quality-gate.test.ts

      - name: Generate and verify exact PDF and ZIP artifacts
        run: npx tsx scripts/guard-499-usd-release.ts
        env:
          CI: "true"
          SOURCE_COMMIT_SHA: ${{ env.EXACT_CANDIDATE_SHA }}

      - name: Enforce verifier status single truth in exact PDFs
        run: npx tsx scripts/guard-verifier-status-consistency.ts

      - name: Upload exact release evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cbamvalid-499-release-${{ env.EXACT_CANDIDATE_SHA }}
          path: artifacts/499-usd-release/
          retention-days: 30
          if-no-files-found: error
