name: Deploy current validated main to production once

on:
  pull_request:
    branches:
      - main
    types: [opened, reopened, synchronize]

permissions:
  contents: read

concurrency:
  group: cbamvalid-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.head_ref == 'ops/deploy-main-082c47d-20260805'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    environment:
      name: production
      url: https://cbamvalid.com
    env:
      TARGET_SHA: 6ea1ac7b225c6976e16c540f60fff9a4eb46722e
      FIREBASE_PROJECT: cbam-desk
      LIVE_BASE_URL: https://cbamvalid.com
      FIREBASE_TOOLS_VERSION: 15.24.0
      GCP_CREDENTIALS_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CBAM_DESK || secrets.FIREBASE_SERVICE_ACCOUNT || secrets.GCP_SERVICE_ACCOUNT_JSON || secrets.GOOGLE_SERVICE_ACCOUNT_JSON || secrets.GCP_SA_KEY || secrets.GOOGLE_CREDENTIALS }}
      GCP_CREDENTIALS_B64: ${{ secrets.FIREBASE_ADMIN_SERVICE_ACCOUNT_B64 || secrets.GOOGLE_CREDENTIALS_B64 }}
      PRODUCTION_ENV_B64: ${{ secrets.CBAMVALID_PRODUCTION_ENV_B64 }}
      PRODUCTION_ENV_RAW: ${{ secrets.CBAMVALID_PRODUCTION_ENV }}

    steps:
      - name: Checkout exact merged main commit
        uses: actions/checkout@v5
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify immutable deployment target is still current main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git rev-parse origin/main)" = "$TARGET_SHA"
          git diff --exit-code
          echo "IMMUTABLE_TARGET=PASS"

      - name: Materialize and validate production credentials
        shell: bash
        run: |
          set -euo pipefail
          umask 077

          credential_file="$RUNNER_TEMP/cbamvalid-deployer.json"
          production_env_file="$GITHUB_WORKSPACE/.env.production.local"

          if [ -n "$GCP_CREDENTIALS_JSON" ]; then
            printf '%s' "$GCP_CREDENTIALS_JSON" > "$credential_file"
            auth_source="json"
          elif [ -n "$GCP_CREDENTIALS_B64" ]; then
            printf '%s' "$GCP_CREDENTIALS_B64" | base64 --decode > "$credential_file"
            auth_source="base64"
          else
            echo "DEPLOY_BLOCKER=FIREBASE_SERVICE_ACCOUNT_MISSING" >&2
            exit 78
          fi

          if [ -n "$PRODUCTION_ENV_B64" ]; then
            printf '%s' "$PRODUCTION_ENV_B64" | base64 --decode > "$production_env_file"
            env_source="base64"
          elif [ -n "$PRODUCTION_ENV_RAW" ]; then
            printf '%s\n' "$PRODUCTION_ENV_RAW" > "$production_env_file"
            env_source="raw"
          else
            echo "DEPLOY_BLOCKER=CBAMVALID_PRODUCTION_ENV_MISSING" >&2
            exit 79
          fi

          python - "$credential_file" "$production_env_file" "$FIREBASE_PROJECT" <<'PY'
          import json
          import pathlib
          import sys

          credential_path = pathlib.Path(sys.argv[1])
          env_path = pathlib.Path(sys.argv[2])
          expected_project = sys.argv[3]

          credential = json.loads(credential_path.read_text())
          if credential.get("type") != "service_account":
              raise SystemExit("Credential is not a service-account JSON document")
          if credential.get("project_id") != expected_project:
              raise SystemExit(
                  f"Credential project mismatch: expected {expected_project}"
              )
          for key in ("client_email", "private_key"):
              if not credential.get(key):
                  raise SystemExit(f"Credential is missing {key}")

          env = {}
          for raw_line in env_path.read_text().splitlines():
              line = raw_line.strip()
              if not line or line.startswith("#") or "=" not in line:
                  continue
              key, value = line.split("=", 1)
              env[key.strip()] = value.strip().strip('"').strip("'")

          required = (
              "NEXT_PUBLIC_FIREBASE_API_KEY",
              "NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN",
              "NEXT_PUBLIC_FIREBASE_PROJECT_ID",
              "NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET",
              "NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID",
              "NEXT_PUBLIC_FIREBASE_APP_ID",
              "PADDLE_ENV",
              "NEXT_PUBLIC_PADDLE_ENV",
              "PADDLE_API_KEY",
              "NEXT_PUBLIC_PADDLE_CLIENT_TOKEN",
              "NEXT_PUBLIC_PADDLE_PRICE_ID",
              "PADDLE_WEBHOOK_SECRET",
          )
          missing = [key for key in required if not env.get(key)]
          if missing:
              raise SystemExit(
                  "Production environment is missing: " + ", ".join(missing)
              )
          if env["NEXT_PUBLIC_FIREBASE_PROJECT_ID"] != expected_project:
              raise SystemExit("Firebase client project does not match deployment project")
          if any("placeholder" in env[key].lower() for key in required):
              raise SystemExit("Production environment contains placeholder values")
          PY

          cat >> "$production_env_file" <<'ENV'
          ADMIN_USE_ADC=true
          ADMIN_ADC_RUNTIME_CONFIRMED=true
          AUTH_ALLOWED_ORIGINS=https://cbamvalid.com
          FIREBASE_PROJECT=cbam-desk
          GCLOUD_PROJECT=cbam-desk
          FUNCTIONS_REGION=europe-west1
          ENV

          chmod 600 "$credential_file" "$production_env_file"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$credential_file" >> "$GITHUB_ENV"
          echo "AUTH_SOURCE=$auth_source"
          echo "PRODUCTION_ENV_SOURCE=$env_source"
          echo "PRODUCTION_INPUT_VALIDATION=PASS"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install locked dependencies and pinned Firebase CLI
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm install --global "firebase-tools@$FIREBASE_TOOLS_VERSION" --no-audit --no-fund
          firebase --version
          firebase experiments:enable webframeworks

      - name: Reconfirm release guards and production build
        shell: bash
        env:
          CI: "true"
          NEXT_TELEMETRY_DISABLED: "1"
        run: |
          set -euo pipefail
          npm run guard:hosting-architecture
          npm run guard:auth-architecture
          npm run guard:case-runtime-contract
          npm run guard:github-actions
          npm run typecheck
          npm run build

      - name: Deploy atomic Firebase Hosting release
        shell: bash
        run: bash scripts/deploy-hosting-cutover.sh

      - name: Verify live public routes and repair-route presence
        shell: bash
        run: |
          set -euo pipefail

          for path in / /login /cases /cases/new; do
            code="$(curl --retry 8 --retry-delay 5 --retry-all-errors -L -sS -o /tmp/cbamvalid-page.html -w '%{http_code}' "${LIVE_BASE_URL}${path}")"
            echo "SMOKE ${path} -> ${code}"
            test "$code" -ge 200
            test "$code" -lt 500
          done

          api_code="$(curl --retry 8 --retry-delay 5 --retry-all-errors -sS -o /tmp/cbamvalid-api.txt -w '%{http_code}' "${LIVE_BASE_URL}/api/qa/reconcile-teb232")"
          echo "SMOKE /api/qa/reconcile-teb232 -> ${api_code}"
          test "$api_code" != "404"
          test "$api_code" -lt 500

          echo "PUBLIC_RUNTIME_SMOKE=PASS"
          echo "RECONCILE_ROUTE_PRESENT=PASS"

      - name: Record deployment evidence
        if: always()
        shell: bash
        run: |
          {
            echo "TARGET_SHA=$TARGET_SHA"
            echo "PROJECT=$FIREBASE_PROJECT"
            echo "LIVE_BASE_URL=$LIVE_BASE_URL"
            echo "FIREBASE_TOOLS_VERSION=$FIREBASE_TOOLS_VERSION"
            echo "WORKFLOW_RUN_ID=$GITHUB_RUN_ID"
            echo "WORKFLOW_ATTEMPT=$GITHUB_RUN_ATTEMPT"
            echo "COMPLETED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } | tee deployment-evidence.txt

      - name: Upload deployment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cbamvalid-production-deploy-${{ env.TARGET_SHA }}-${{ github.run_attempt }}
          path: deployment-evidence.txt
          if-no-files-found: error
          retention-days: 30
