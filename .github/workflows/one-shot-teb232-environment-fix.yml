name: One-shot Teb232 environment fix

on:
  push:
    branches:
      - fix/teb232-four-complete-test-cases-20260802

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/teb232-four-complete-test-cases-20260802
          fetch-depth: 0
      - name: Preserve schema enums and pin production review environment
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/refresh-teb232-four-complete-cases.ts')
          s = p.read_text()

          old = '''  if (typeof value === "string") {
    return value
      .replace(/sandbox fixture/gi, "controlled test record")'''
          new = '''  if (typeof value === "string") {
    if (value === "SANDBOX" || value === "PRODUCTION") return value;
    return value
      .replace(/sandbox fixture/gi, "controlled test record")'''
          if s.count(old) != 1:
              raise SystemExit('string cleaner target not found exactly once')
          s = s.replace(old, new, 1)

          old = '''  data.evidenceRegister = data.evidenceRegister.map((record) => ({
    ...record,
    storagePath: `evidence/${TEB232_UID}/${caseId}/${record.evidenceId}/${record.fileName}`,
    uploader: TEB232_UID,
  }));'''
          new = '''  data.evidenceRegister = data.evidenceRegister.map((record) => ({
    ...record,
    storagePath: `evidence/${TEB232_UID}/${caseId}/${record.evidenceId}/${record.fileName}`,
    uploader: TEB232_UID,
    reviewEnvironment: "PRODUCTION" as const,
  }));
  data.methodologyDecisions = data.methodologyDecisions.map((decision) => ({
    ...decision,
    decisionEnvironment: "PRODUCTION" as const,
  }));'''
          if s.count(old) != 1:
              raise SystemExit('environment normalization target not found exactly once')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY

          git rm .github/workflows/one-shot-teb232-environment-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/refresh-teb232-four-complete-cases.ts
          git commit -m "fix(qa): preserve production review environment enums"
          git push origin HEAD:fix/teb232-four-complete-test-cases-20260802
