name: Apply Step 8 premium release fix

on:
  push:
    branches:
      - fix/step8-premium-release-command-center-20260802
    paths:
      - scripts/apply-step8-premium-ux.mjs
      - .github/workflows/apply-step8-premium-fix.yml
  pull_request:
    branches:
      - main
    types: [opened, reopened, synchronize]

permissions:
  contents: write

concurrency:
  group: step8-premium-release-fix
  cancel-in-progress: false

jobs:
  apply-and-validate:
    if: github.head_ref == 'fix/step8-premium-release-command-center-20260802' || github.ref_name == 'fix/step8-premium-release-command-center-20260802'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_FIREBASE_API_KEY: "ci-placeholder-not-a-secret"
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: "cbamvalid-ci.invalid"
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: "cbamvalid-ci"
      NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: "cbamvalid-ci.appspot.com"
      NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "000000000000"
      NEXT_PUBLIC_FIREBASE_APP_ID: "1:000000000000:web:0000000000000000000000"
      ADMIN_USE_ADC: "true"
      GCLOUD_PROJECT: "cbamvalid-ci"
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v5
        with:
          ref: fix/step8-premium-release-command-center-20260802
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Apply bounded Step 8 patch
        run: node scripts/apply-step8-premium-ux.mjs

      - name: Check patch integrity
        run: git diff --check

      - name: Validate targeted Step 8 contracts
        run: >-
          npx vitest run
          tests/integration/wizard-footer.test.ts
          tests/integration/wizard-status-semantics.test.ts
          tests/integration/step8-premium-release-command-center.test.ts
          tests/integration/step8-honesty.test.ts

      - name: Run complete release gate
        run: npm run ci:gate

      - name: Commit validated implementation
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "No implementation diff was produced."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(step8): add premium release command center"
          git push origin HEAD:fix/step8-premium-release-command-center-20260802
