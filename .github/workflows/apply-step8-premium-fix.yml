name: Apply Step 8 premium release fix

on:
  push:
    branches:
      - fix/step8-premium-release-command-center-20260802
    paths:
      - scripts/apply-step8-premium-ux.mjs
      - .github/workflows/apply-step8-premium-fix.yml

permissions:
  contents: write

concurrency:
  group: step8-premium-release-fix
  cancel-in-progress: false

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/step8-premium-release-command-center-20260802
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Apply bounded Step 8 patch
        run: node scripts/apply-step8-premium-ux.mjs

      - name: Check patch integrity
        run: git diff --check

      - name: Validate targeted Step 8 contracts
        run: >-
          npx vitest run
          tests/integration/wizard-footer.test.ts
          tests/integration/wizard-status-semantics.test.ts
          tests/integration/step8-premium-release-command-center.test.ts
          tests/integration/step8-honesty.test.ts

      - name: Run complete release gate
        run: npm run ci:gate

      - name: Commit validated implementation
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "No implementation diff was produced."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(step8): add premium release command center"
          git push origin HEAD:fix/step8-premium-release-command-center-20260802
