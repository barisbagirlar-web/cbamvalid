name: One-shot fix operator score label

on:
  push:
    branches:
      - fix/449-commercial-acceptance-contract-20260808

permissions:
  contents: write

jobs:
  edit-and-remove-self:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/449-commercial-acceptance-contract-20260808
      - name: Correct commercial score label and remove one-shot workflow
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('functions/src/cbam/report/premium-dossier-pdf-impl.ts')
          text = path.read_text()
          old = 'Automated readiness including period eligibility'
          new = 'Operator-controlled data and calculation readiness'
          if old not in text:
              raise SystemExit('expected score label not found')
          path.write_text(text.replace(old, new))
          PY
          rm .github/workflows/one-shot-fix-operator-score-label.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add functions/src/cbam/report/premium-dossier-pdf-impl.ts .github/workflows/one-shot-fix-operator-score-label.yml
          git commit -m "fix: separate operator preparation from period eligibility"
          git push origin HEAD:fix/449-commercial-acceptance-contract-20260808
