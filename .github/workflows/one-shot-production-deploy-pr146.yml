name: One-shot production deploy PR146

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-shot-production-deploy-pr146.yml"

permissions:
  contents: read

concurrency:
  group: cbamvalid-production-deploy
  cancel-in-progress: false

jobs:
  deploy-production:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      TARGET_SHA: 07bb151e047bff38e1ca384eaedc227e7ccdb4f6
      PR_HEAD_SHA: 31105c49790607c63469c6b5f3f1a6952d28d148
      FIREBASE_PROJECT: cbam-desk
      LIVE_BASE_URL: https://cbamvalid.com
      SA_GCP_KEY: ${{ secrets.GCP_SA_KEY }}
      SA_GOOGLE_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
      SA_GCLOUD_KEY: ${{ secrets.GCLOUD_SERVICE_KEY }}
      SA_GCP_SERVICE_KEY: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}
      SA_FIREBASE_GENERIC: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      SA_FIREBASE_CBAM: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CBAM_DESK }}
      FIREBASE_DEPLOY_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

    steps:
      - name: Checkout exact merged production candidate
        uses: actions/checkout@v7
        with:
          ref: ${{ env.TARGET_SHA }}
          persist-credentials: false
          fetch-depth: 2

      - name: Prove exact deployment provenance
        shell: bash
        run: |
          set -euo pipefail
          ACTUAL_SHA="$(git rev-parse HEAD)"
          printf 'PR_HEAD_SHA=%s\n' "${PR_HEAD_SHA}"
          printf 'TARGET_SHA=%s\n' "${TARGET_SHA}"
          printf 'ACTUAL_SHA=%s\n' "${ACTUAL_SHA}"
          test "${ACTUAL_SHA}" = "${TARGET_SHA}"

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Verify Node 24 runtime
        run: node --version | grep -E '^v24\.'

      - name: Install locked dependencies
        run: npm ci

      - name: Production preflight
        shell: bash
        run: |
          set -euo pipefail
          npm run guard:hosting-architecture
          npm run typecheck
          npm run build:functions

      - name: Prepare available Firebase credentials
        shell: bash
        run: |
          set -euo pipefail
          CANDIDATES="${RUNNER_TEMP}/firebase-auth-candidates.txt"
          : > "${CANDIDATES}"
          add_candidate() {
            local label="$1"
            local value="$2"
            if [[ -z "${value}" ]]; then
              return
            fi
            local file="${RUNNER_TEMP}/firebase-${label}.json"
            printf '%s' "${value}" > "${file}"
            if node -e 'JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"))' "${file}" 2>/dev/null; then
              chmod 600 "${file}"
              printf '%s|%s\n' "${label}" "${file}" >> "${CANDIDATES}"
            fi
          }
          add_candidate 'gcp-key' "${SA_GCP_KEY:-}"
          add_candidate 'google-json' "${SA_GOOGLE_JSON:-}"
          add_candidate 'gcloud-key' "${SA_GCLOUD_KEY:-}"
          add_candidate 'gcp-service-key' "${SA_GCP_SERVICE_KEY:-}"
          add_candidate 'firebase-generic' "${SA_FIREBASE_GENERIC:-}"
          add_candidate 'firebase-cbam' "${SA_FIREBASE_CBAM:-}"
          if [[ ! -s "${CANDIDATES}" && -z "${FIREBASE_DEPLOY_TOKEN:-}" ]]; then
            printf '%s\n' '::error::No Firebase/GCP production deployment credential is configured.'
            exit 78
          fi
          printf 'Prepared %s service-account candidate(s); token fallback present=%s\n' \
            "$(wc -l < "${CANDIDATES}")" \
            "$([[ -n "${FIREBASE_DEPLOY_TOKEN:-}" ]] && printf yes || printf no)"

      - name: Install Firebase CLI
        shell: bash
        run: |
          set -euo pipefail
          npm install --global firebase-tools@latest
          firebase --version

      - name: Deploy changed sealing function with credential cascade
        shell: bash
        run: |
          set -euo pipefail
          CANDIDATES="${RUNNER_TEMP}/firebase-auth-candidates.txt"
          DIAGNOSTICS="${RUNNER_TEMP}/firebase-deploy-diagnostics.log"
          : > "${DIAGNOSTICS}"
          deployed=0

          while IFS='|' read -r label credential_file; do
            [[ -n "${label}" && -n "${credential_file}" ]] || continue
            export GOOGLE_APPLICATION_CREDENTIALS="${credential_file}"
            ACCESS_LOG="${RUNNER_TEMP}/firebase-access-${label}.log"
            DEPLOY_LOG="${RUNNER_TEMP}/firebase-deploy-${label}.log"
            if ! firebase projects:list --json >"${ACCESS_LOG}" 2>&1; then
              printf '[%s] project access failed\n' "${label}" >> "${DIAGNOSTICS}"
              grep -Ei 'error:|http error|permission|denied|forbidden|unauthorized|insufficient|403|401' "${ACCESS_LOG}" | tail -n 2 >> "${DIAGNOSTICS}" || true
              continue
            fi
            if ! grep -q 'cbam-desk' "${ACCESS_LOG}"; then
              printf '[%s] target project not visible\n' "${label}" >> "${DIAGNOSTICS}"
              continue
            fi
            if firebase deploy --only functions:sealCbamReport --project "${FIREBASE_PROJECT}" --non-interactive >"${DEPLOY_LOG}" 2>&1; then
              cat "${DEPLOY_LOG}"
              printf 'GOOGLE_APPLICATION_CREDENTIALS=%s\n' "${credential_file}" >> "${GITHUB_ENV}"
              printf 'FIREBASE_DEPLOY_AUTH=adc\n' >> "${GITHUB_ENV}"
              printf 'Firebase deployment credential selected: %s\n' "${label}"
              deployed=1
              break
            fi
            printf '[%s] sealCbamReport deploy failed\n' "${label}" >> "${DIAGNOSTICS}"
            grep -Ei 'error:|http error|permission|denied|forbidden|unauthorized|insufficient|failed to|403|401' "${DEPLOY_LOG}" | tail -n 3 >> "${DIAGNOSTICS}" || true
          done < "${CANDIDATES}"

          if [[ "${deployed}" -eq 0 && -n "${FIREBASE_DEPLOY_TOKEN:-}" ]]; then
            unset GOOGLE_APPLICATION_CREDENTIALS
            TOKEN_LOG="${RUNNER_TEMP}/firebase-deploy-token.log"
            if firebase deploy --only functions:sealCbamReport --project "${FIREBASE_PROJECT}" --non-interactive --token "${FIREBASE_DEPLOY_TOKEN}" >"${TOKEN_LOG}" 2>&1; then
              cat "${TOKEN_LOG}"
              printf 'FIREBASE_DEPLOY_AUTH=token\n' >> "${GITHUB_ENV}"
              deployed=1
            else
              printf '[firebase-token] sealCbamReport deploy failed\n' >> "${DIAGNOSTICS}"
              grep -Ei 'error:|http error|permission|denied|forbidden|unauthorized|insufficient|failed to|403|401' "${TOKEN_LOG}" | tail -n 3 >> "${DIAGNOSTICS}" || true
            fi
          fi

          if [[ "${deployed}" -ne 1 ]]; then
            tail -n 8 "${DIAGNOSTICS}" \
              | sed -E 's/%/%25/g; s/::/%3A%3A/g' \
              | while IFS= read -r line; do printf '::error::Firebase Functions: %s\n' "${line}"; done
            exit 1
          fi

      - name: Deploy framework-aware Hosting production
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${FIREBASE_DEPLOY_AUTH:-}" == "token" ]]; then
            unset GOOGLE_APPLICATION_CREDENTIALS
            firebase deploy --only hosting --project "${FIREBASE_PROJECT}" --non-interactive --token "${FIREBASE_DEPLOY_TOKEN}"
          else
            firebase deploy --only hosting --project "${FIREBASE_PROJECT}" --non-interactive
          fi

      - name: Verify live release assets and routes
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-live-next-assets.mjs "${LIVE_BASE_URL}"
          curl --fail --silent --show-error --location --max-time 30 "${LIVE_BASE_URL}/" >/dev/null
          curl --fail --silent --show-error --location --max-time 30 "${LIVE_BASE_URL}/auth/login" >/dev/null
          {
            printf '%s\n' '## Production deployment PASS'
            printf '%s\n' "- PR head: ${PR_HEAD_SHA}"
            printf '%s\n' "- deployed merge commit: ${TARGET_SHA}"
            printf '%s\n' "- Firebase project: ${FIREBASE_PROJECT}"
            printf '%s\n' "- live URL: ${LIVE_BASE_URL}"
            printf '%s\n' '- changed Cloud Function sealCbamReport deployed'
            printf '%s\n' '- framework-aware Hosting deployed'
            printf '%s\n' '- live Next.js asset integrity verified'
          } >> "${GITHUB_STEP_SUMMARY}"
