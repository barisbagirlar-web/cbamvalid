name: One-shot final 9.9 security repair

on:
  push:
    branches: [fix/final-99-acceptance-20260808]
    paths:
      - ".github/workflows/one-shot-final-99-security-repair.yml"

permissions:
  contents: write

jobs:
  repair-validate-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout dedicated repair branch
        uses: actions/checkout@v7
        with:
          ref: fix/final-99-acceptance-20260808
          fetch-depth: 2
          persist-credentials: true

      - name: Prove clean starting tree
        shell: bash
        run: |
          set -euo pipefail
          DIRTY="$(git status --porcelain)"
          if [[ -n "${DIRTY}" ]]; then
            printf '%s\n' '::error::Unexpected dirty checkout before repair:'
            printf '%s\n' "${DIRTY}"
            exit 1
          fi
          printf '%s\n' 'CLEAN_START=PASS'

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install locked dependencies
        run: |
          npm ci
          npm --prefix functions ci --no-audit --no-fund

      - name: Apply non-breaking production security repairs
        shell: bash
        run: |
          set -euo pipefail
          npm audit fix --omit=dev
          npm --prefix functions audit fix --omit=dev
          cp package-lock.json "${RUNNER_TEMP}/root-package-lock.json"
          cp functions/package-lock.json "${RUNNER_TEMP}/functions-package-lock.json"
          printf '%s\n' 'SECURITY_REPAIR_MODE=npm-audit-fix-non-force'

      - name: Block HIGH or CRITICAL production vulnerabilities
        run: |
          npm audit --omit=dev --audit-level=high
          npm --prefix functions audit --omit=dev --audit-level=high

      - name: English-only release guard
        shell: bash
        run: |
          set -euo pipefail
          if ! npm run guard:english-only; then
            printf '%s\n' '::error::ENGLISH_ONLY_GUARD_FAILED: Turkish/non-English production copy detected. Build/release intentionally stopped.'
            exit 1
          fi

      - name: Build and enterprise guards
        run: |
          npm run guard:hosting-architecture
          npm run guard:auth-architecture
          npm run guard:workspace-navigation
          npm run guard:case-runtime-contract
          npm run guard:verifier-grade-deliverables
          npm run guard:external-acceptance
          npm run guard:premium-dossier-release
          npm run typecheck
          npm run build:functions
          npm run lint
          npm run test:auth
          npm run test:integration
          npm run test:commerce
          npm run test:cbam-engine
          npm run test:reports
          npm run build

      - name: Frozen premium artifact acceptance
        run: |
          npx vitest run \
            tests/reports/release-499-contract.test.ts \
            tests/reports/verifier-status-single-truth.test.ts \
            tests/reports/premium-dossier-truth-contract.test.ts \
            tests/reports/cross-format-consistency.test.ts \
            tests/reports/premium-package-hardening.test.ts
          CI=true SOURCE_COMMIT_SHA="$(git rev-parse HEAD)" npx tsx scripts/guard-499-usd-release.ts
          npx tsx scripts/guard-verifier-status-consistency.ts

      - name: Clean generated dirt and restore only audited lockfiles
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' '--- generated/temporary dirty state before cleanup ---'
          git status --short || true
          git reset --hard HEAD
          git clean -fd
          cp "${RUNNER_TEMP}/root-package-lock.json" package-lock.json
          cp "${RUNNER_TEMP}/functions-package-lock.json" functions/package-lock.json
          printf '%s\n' '--- controlled changes retained for commit ---'
          git status --short
          OTHER="$(git diff --name-only | grep -Ev '^(package-lock\.json|functions/package-lock\.json)$' || true)"
          if [[ -n "${OTHER}" ]]; then
            printf '%s\n' '::error::Unexpected tracked change survived cleanup:'
            printf '%s\n' "${OTHER}"
            exit 1
          fi

      - name: Commit and push validated lockfile repair
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- package-lock.json functions/package-lock.json; then
            printf '%s\n' 'No lockfile repair required.'
            exit 0
          fi
          git config user.name 'cbamvalid-release-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add package-lock.json functions/package-lock.json
          git commit -m 'fix(security): remove high production dependency findings'
          git push origin HEAD:fix/final-99-acceptance-20260808
