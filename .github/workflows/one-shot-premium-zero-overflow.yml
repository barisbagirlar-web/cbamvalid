name: One-shot premium zero overflow

on:
  push:
    branches:
      - fix/premium-report-zero-overflow-20260802

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/premium-report-zero-overflow-20260802
          fetch-depth: 0
      - name: Remove hidden glyph overflow and tighten the contract
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          renderer = Path('functions/src/cbam/report/premium-dossier-pdf-impl.ts')
          text = renderer.read_text()
          old = '  doc.text(".", 1, 1);'
          new = '  doc.text(".", 1, 5);'
          if text.count(old) != 1:
              raise SystemExit(f'expected one hidden glyph target, found {text.count(old)}')
          renderer.write_text(text.replace(old, new, 1))

          test = Path('tests/reports/premium-101-report-contract.test.ts')
          source = test.read_text()
          old = '        if (x < -50 || x > viewport.width + 50 || y < -50 || y > viewport.height + 50) {'
          new = '        if (x < -0.5 || x > viewport.width + 0.5 || y < -0.5 || y > viewport.height + 0.5) {'
          if source.count(old) != 1:
              raise SystemExit(f'expected one clipping tolerance target, found {source.count(old)}')
          test.write_text(source.replace(old, new, 1))
          PY

          git rm .github/workflows/one-shot-premium-zero-overflow.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add functions/src/cbam/report/premium-dossier-pdf-impl.ts tests/reports/premium-101-report-contract.test.ts
          git commit -m "fix(report): enforce zero-overflow PDF geometry"
          git push origin HEAD:fix/premium-report-zero-overflow-20260802
