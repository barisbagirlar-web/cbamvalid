name: One-shot hosting deploy Step 8 premium actions

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-shot-hosting-deploy-step8-premium-actions.yml"

permissions:
  contents: read

concurrency:
  group: cbamvalid-production-deploy
  cancel-in-progress: false

jobs:
  deploy-hosting:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      TARGET_APP_SHA: 68034d33565a92888eebaf2e92f4f57cbb8148b7
      FIREBASE_PROJECT: cbam-desk
      LIVE_BASE_URL: https://cbamvalid.com
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      SA_FIREBASE_CBAM: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CBAM_DESK }}

    steps:
      - name: Checkout exact merged Step 8 UI candidate
        uses: actions/checkout@v7
        with:
          ref: ${{ env.TARGET_APP_SHA }}
          persist-credentials: false
          fetch-depth: 2

      - name: Prove exact deployment provenance and clean tree
        shell: bash
        run: |
          set -euo pipefail
          ACTUAL_SHA="$(git rev-parse HEAD)"
          printf 'TARGET_APP_SHA=%s\n' "${TARGET_APP_SHA}"
          printf 'ACTUAL_SHA=%s\n' "${ACTUAL_SHA}"
          test "${ACTUAL_SHA}" = "${TARGET_APP_SHA}"
          test -z "$(git status --porcelain)"

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Verify Node 24 runtime
        run: node --version | grep -E '^v24\.'

      - name: Install exact locked dependencies
        run: npm ci

      - name: Frontend production preflight
        shell: bash
        run: |
          set -euo pipefail
          npm run guard:english-only
          npm run guard:hosting-architecture
          npm run guard:auth-architecture
          npm run typecheck
          npx vitest run tests/integration/step8-premium-action-visual-contract.test.ts tests/integration/step8-final-action-hierarchy.test.ts tests/integration/step8-footer-conflict-regression.test.ts

      - name: Prepare Firebase production credential
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SA_FIREBASE_CBAM:-}" || { echo '::error::FIREBASE_SERVICE_ACCOUNT_CBAM_DESK is missing'; exit 78; }
          CREDENTIAL_FILE="${RUNNER_TEMP}/firebase-cbam.json"
          printf '%s' "${SA_FIREBASE_CBAM}" > "${CREDENTIAL_FILE}"
          node -e 'JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"))' "${CREDENTIAL_FILE}"
          chmod 600 "${CREDENTIAL_FILE}"
          printf 'GOOGLE_APPLICATION_CREDENTIALS=%s\n' "${CREDENTIAL_FILE}" >> "${GITHUB_ENV}"

      - name: Install Firebase CLI and verify project access
        shell: bash
        run: |
          set -euo pipefail
          npm install --global firebase-tools@latest
          firebase --version
          firebase experiments:enable webframeworks
          firebase projects:list --json | grep -q 'cbam-desk'

      - name: Resolve production Firebase Web SDK build config
        shell: bash
        run: |
          set -euo pipefail
          CONFIG_FILE="${RUNNER_TEMP}/firebase-web-sdk-config.json"
          SDK_RAW="${RUNNER_TEMP}/firebase-sdkconfig-raw.json"
          if curl --fail --silent --show-error --location --max-time 30 \
            "${LIVE_BASE_URL}/__/firebase/init.json" > "${CONFIG_FILE}" \
            && node -e 'const c=JSON.parse(require("fs").readFileSync(process.argv[1],"utf8")); if(!c.apiKey||!c.appId||!c.projectId) process.exit(1)' "${CONFIG_FILE}"; then
            printf '%s\n' 'Firebase Web SDK config source: live reserved Hosting endpoint'
          else
            rm -f "${CONFIG_FILE}"
            firebase apps:sdkconfig WEB --project "${FIREBASE_PROJECT}" --json > "${SDK_RAW}"
            node - "${SDK_RAW}" "${CONFIG_FILE}" <<'NODE'
          const fs = require('fs');
          const raw = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const config = raw?.result?.sdkConfig ?? raw?.result ?? raw;
          fs.writeFileSync(process.argv[3], JSON.stringify(config));
          NODE
          fi
          node - "${CONFIG_FILE}" "${GITHUB_ENV}" <<'NODE'
          const fs = require('fs');
          const config = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const required = {
            NEXT_PUBLIC_FIREBASE_API_KEY: config.apiKey,
            NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: config.authDomain || `${config.projectId}.firebaseapp.com`,
            NEXT_PUBLIC_FIREBASE_PROJECT_ID: config.projectId,
            NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: config.storageBucket,
            NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: config.messagingSenderId,
            NEXT_PUBLIC_FIREBASE_APP_ID: config.appId,
          };
          for (const [key, value] of Object.entries(required)) {
            if (!value || typeof value !== 'string' || !value.trim()) throw new Error(`FIREBASE_CLIENT_CONFIG_MISSING:${key}`);
            fs.appendFileSync(process.argv[3], `${key}=${value.trim()}\n`);
          }
          fs.appendFileSync(process.argv[3], `ADMIN_USE_ADC=true\nGCLOUD_PROJECT=${config.projectId}\nGOOGLE_CLOUD_PROJECT=${config.projectId}\n`);
          NODE

      - name: Deploy framework-aware Hosting only
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/deploy-hosting-cutover.sh

      - name: Verify live public routes
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --max-time 30 "${LIVE_BASE_URL}/" >/dev/null
          curl --fail --silent --show-error --location --max-time 30 "${LIVE_BASE_URL}/login" >/dev/null
          {
            printf '%s\n' '## Step 8 premium action Hosting deployment PASS'
            printf '%s\n' "- deployed exact application SHA: ${TARGET_APP_SHA}"
            printf '%s\n' '- frontend production guards PASS'
            printf '%s\n' '- framework-aware Hosting-only deploy PASS'
            printf '%s\n' '- live Next.js asset integrity PASS'
            printf '%s\n' '- public route smoke checks PASS'
          } >> "${GITHUB_STEP_SUMMARY}"
