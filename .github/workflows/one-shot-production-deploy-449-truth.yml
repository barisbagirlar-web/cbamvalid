name: One-shot production deploy 449 truth contract

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-shot-production-deploy-449-truth.yml"

permissions:
  contents: read

concurrency:
  group: cbamvalid-production-deploy
  cancel-in-progress: false

jobs:
  deploy-production:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      TARGET_SHA: abfa227d39f6040e9b577bcb38b08261ffa55d7b
      FIREBASE_PROJECT: cbam-desk
      LIVE_BASE_URL: https://cbamvalid.com
      SA_FIREBASE_CBAM: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CBAM_DESK }}

    steps:
      - name: Checkout exact merged commercial-acceptance candidate
        uses: actions/checkout@v7
        with:
          ref: ${{ env.TARGET_SHA }}
          persist-credentials: false
          fetch-depth: 2

      - name: Prove exact deployment provenance
        shell: bash
        run: |
          set -euo pipefail
          ACTUAL_SHA="$(git rev-parse HEAD)"
          printf 'TARGET_SHA=%s\n' "${TARGET_SHA}"
          printf 'ACTUAL_SHA=%s\n' "${ACTUAL_SHA}"
          test "${ACTUAL_SHA}" = "${TARGET_SHA}"

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Verify Node 24 runtime
        run: node --version | grep -E '^v24\.'

      - name: Install locked dependencies
        run: npm ci

      - name: Commercial acceptance preflight
        shell: bash
        run: |
          set -euo pipefail
          npm run typecheck
          npm run build:functions
          npx vitest run \
            tests/reports/premium-dossier-truth-contract.test.ts \
            tests/reports/premium-package-hardening.test.ts \
            tests/reports/cross-format-consistency.test.ts \
            tests/reports/verifier-status-single-truth.test.ts
          npx tsx scripts/guard-499-usd-release.ts

      - name: Prepare Firebase credential
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SA_FIREBASE_CBAM:-}" || { echo '::error::FIREBASE_SERVICE_ACCOUNT_CBAM_DESK is missing'; exit 78; }
          CREDENTIAL_FILE="${RUNNER_TEMP}/firebase-cbam.json"
          printf '%s' "${SA_FIREBASE_CBAM}" > "${CREDENTIAL_FILE}"
          node -e 'const x=JSON.parse(require("fs").readFileSync(process.argv[1],"utf8")); if(x.type!=="service_account"||x.project_id!=="cbam-desk"||!x.client_email||!x.private_key) process.exit(1)' "${CREDENTIAL_FILE}"
          chmod 600 "${CREDENTIAL_FILE}"
          printf 'GOOGLE_APPLICATION_CREDENTIALS=%s\n' "${CREDENTIAL_FILE}" >> "${GITHUB_ENV}"

      - name: Install Firebase CLI
        shell: bash
        run: |
          set -euo pipefail
          npm install --global firebase-tools@15.24.0
          firebase --version
          firebase projects:list --json | grep -q 'cbam-desk'
          firebase experiments:enable webframeworks

      - name: Resolve production Firebase Web SDK build config
        shell: bash
        run: |
          set -euo pipefail
          CONFIG_FILE="${RUNNER_TEMP}/firebase-web-sdk-config.json"
          SDK_RAW="${RUNNER_TEMP}/firebase-sdkconfig-raw.json"

          if curl --fail --silent --show-error --location --max-time 30 \
            "${LIVE_BASE_URL}/__/firebase/init.json" > "${CONFIG_FILE}" \
            && node -e 'const c=JSON.parse(require("fs").readFileSync(process.argv[1],"utf8")); if(!c.apiKey||!c.appId||!c.projectId) process.exit(1)' "${CONFIG_FILE}"; then
            printf '%s\n' 'Firebase Web SDK config source: live reserved Hosting endpoint'
          else
            rm -f "${CONFIG_FILE}"
            firebase apps:sdkconfig WEB --project "${FIREBASE_PROJECT}" --json > "${SDK_RAW}"
            node - "${SDK_RAW}" "${CONFIG_FILE}" <<'NODE'
          const fs = require('fs');
          const raw = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const config = raw?.result?.sdkConfig ?? raw?.result ?? raw;
          fs.writeFileSync(process.argv[3], JSON.stringify(config));
          NODE
            printf '%s\n' 'Firebase Web SDK config source: Firebase CLI'
          fi

          node - "${CONFIG_FILE}" "${GITHUB_ENV}" <<'NODE'
          const fs = require('fs');
          const config = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const required = {
            NEXT_PUBLIC_FIREBASE_API_KEY: config.apiKey,
            NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: config.authDomain || `${config.projectId}.firebaseapp.com`,
            NEXT_PUBLIC_FIREBASE_PROJECT_ID: config.projectId,
            NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: config.storageBucket,
            NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: config.messagingSenderId,
            NEXT_PUBLIC_FIREBASE_APP_ID: config.appId,
          };
          for (const [key, value] of Object.entries(required)) {
            if (!value || typeof value !== 'string' || !value.trim()) {
              throw new Error(`FIREBASE_CLIENT_CONFIG_MISSING:${key}`);
            }
            fs.appendFileSync(process.argv[3], `${key}=${value.trim()}\n`);
          }
          fs.appendFileSync(process.argv[3], `ADMIN_USE_ADC=true\nGCLOUD_PROJECT=${config.projectId}\nGOOGLE_CLOUD_PROJECT=${config.projectId}\n`);
          NODE
          printf '%s\n' 'Firebase Web SDK production build config resolved and validated.'

      - name: Deploy exact sealing function and hosting
        shell: bash
        run: |
          set -euo pipefail
          firebase deploy --only functions:sealCbamReport,hosting --project "${FIREBASE_PROJECT}" --non-interactive

      - name: Verify production homepage product truth and outputs
        shell: bash
        run: |
          set -euo pipefail
          FUNCTIONS_JSON="${RUNNER_TEMP}/firebase-functions.json"
          firebase functions:list --project "${FIREBASE_PROJECT}" --json > "${FUNCTIONS_JSON}"
          grep -q 'sealCbamReport' "${FUNCTIONS_JSON}"
          HOME_HTML="${RUNNER_TEMP}/cbamvalid-home.html"
          curl --fail --silent --show-error --location --max-time 30 "${LIVE_BASE_URL}/" > "${HOME_HTML}"
          grep -q 'CBAM Exporter' "${HOME_HTML}"
          grep -q 'Evidence Dossier' "${HOME_HTML}"
          grep -q 'Six controls from case data to sealed handover' "${HOME_HTML}"
          grep -q 'What you receive when the working file is locked' "${HOME_HTML}"
          grep -q 'Verification readiness dossier' "${HOME_HTML}"
          grep -q 'Calculation reproducibility' "${HOME_HTML}"
          grep -q 'Tamper-evident integrity record' "${HOME_HTML}"
          curl --fail --silent --show-error --location --max-time 30 "${LIVE_BASE_URL}/login" >/dev/null
          {
            printf '%s\n' '## Homepage product truth and sealed outputs production deployment PASS'
            printf '%s\n' "- deployed application commit: ${TARGET_SHA}"
            printf '%s\n' "- Firebase project: ${FIREBASE_PROJECT}"
            printf '%s\n' '- release artifact gate passed before deployment'
            printf '%s\n' '- Node 22 used for Firebase framework compatibility'
            printf '%s\n' '- Firebase Web SDK build config resolved before Next.js build'
            printf '%s\n' '- sealCbamReport and Firebase Hosting deployed'
            printf '%s\n' '- homepage product claims and sealed package output section verified on production'
          } >> "${GITHUB_STEP_SUMMARY}"
