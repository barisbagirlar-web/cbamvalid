name: One-shot premium 101 repair 3

on:
  push:
    branches:
      - upgrade/premium-report-101-20260802

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: upgrade/premium-report-101-20260802
          fetch-depth: 0
      - name: Remove final legacy annex assertion
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tests/reports/premium-dossier-v5.test.ts')
          s = p.read_text()
          old = 'expect(text).toContain("ANNEX II");'
          new = 'expect(text).toContain("Annex index and legal boundary");'
          if s.count(old) != 1:
              raise SystemExit('legacy Annex II assertion not found exactly once')
          p.write_text(s.replace(old, new, 1))
          PY
          git rm .github/workflows/one-shot-premium-101-fix-3.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/reports/premium-dossier-v5.test.ts
          git commit -m "test(report): align final annex assertion with premium architecture"
          git push origin HEAD:upgrade/premium-report-101-20260802
