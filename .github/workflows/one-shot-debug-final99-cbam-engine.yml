name: One-shot debug final 9.9 CBAM engine

on:
  push:
    branches: [fix/final-99-acceptance-20260808]
    paths:
      - ".github/workflows/one-shot-debug-final99-cbam-engine.yml"

permissions:
  contents: read

jobs:
  isolate-cbam-engine:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/final-99-acceptance-20260808
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - name: Install exact dependencies
        run: |
          npm ci
          npm --prefix functions ci --no-audit --no-fund
      - name: Apply same non-force security repair in workspace
        run: |
          npm audit fix --omit=dev --audit-level=high
          npm --prefix functions audit fix --omit=dev --audit-level=high
          npm audit --omit=dev --audit-level=high
          npm --prefix functions audit --omit=dev --audit-level=high
      - name: Run CBAM engine regression verbosely
        shell: bash
        run: |
          set -o pipefail
          mkdir -p artifacts/final99-debug
          npm run test:cbam-engine -- --reporter=verbose 2>&1 | tee artifacts/final99-debug/cbam-engine.log
      - name: Upload diagnostic log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: final99-cbam-engine-debug-${{ github.sha }}
          path: artifacts/final99-debug/cbam-engine.log
          retention-days: 7
          if-no-files-found: error
